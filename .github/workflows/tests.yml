name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    name: Core et contenu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Le Core et ses tests n'ont pas besoin du workload MAUI.
      - name: Tests du Core et validation du contenu
        run: dotnet test tests/QuizzWare.Core.Tests -c Release --logger "console;verbosity=normal"

      # Le plan, les arbres de spécialisations, la carte et la liste des identifiants publiés doivent être à jour.
      - name: Contenu synchronisé avec le plan
        run: |
          dotnet run --project tools/GenerateurContenu -c Release
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Le contenu n'est pas à jour : lancer 'dotnet run --project tools/GenerateurContenu' puis commiter."
            git status --short
            git diff --stat
            exit 1
          fi

  app:
    name: Application MAUI
    # Le workload MAUI complet (Android, iOS) n'existe pas sous Linux.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Workload MAUI
        run: dotnet workload install maui

      # ViewModels, accessibilité et remontée des plantages, sur la cible net10.0 de l'application (sans appareil).
      - name: Tests de l'application
        run: dotnet test tests/QuizzWare.App.Tests -c Release --logger "console;verbosity=normal"
