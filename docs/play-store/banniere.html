<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden;
    background: linear-gradient(135deg, #1A1F36 0%, #0F1221 70%); font-family: "Segoe UI", system-ui, sans-serif; color: #E8EAF6; }
  .zone { display: flex; align-items: center; height: 500px; padding: 0 72px; gap: 56px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 72px; letter-spacing: -1px; }
  h1 span { color: #7C4DFF; }
  p { margin: 14px 0 0; font-size: 30px; color: #9AA0C3; line-height: 1.35; }
  .tags { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tag { border: 2px solid #2F365A; border-radius: 22px; padding: 6px 16px; font-size: 22px; font-weight: 600; }
  .tag.or { border-color: #FFC857; color: #FFC857; }
</style></head>
<body>
<!-- Bannière 1024 × 500 de la fiche Play Store. -->
<div class="zone">
  <svg width="260" height="260" viewBox="90 110 280 250" xmlns="http://www.w3.org/2000/svg">
    <rect x="98" y="118" width="260" height="190" rx="36" fill="#7C4DFF" />
    <path d="M168 308 L168 350 L212 308 Z" fill="#7C4DFF" />
    <path d="M178 170 L140 213 L178 256" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M278 170 L316 213 L278 256" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M208 186 Q208 162 228 162 Q250 162 250 184 Q250 200 230 206 L230 222" fill="none" stroke="#FFC857" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="230" cy="248" r="9" fill="#FFC857" />
  </svg>
  <div>
    <h1>Quizz<span>Ware</span></h1>
    <p>5 minutes par jour pour progresser<br>en développement logiciel.</p>
    <div class="tags">
      <span class="tag">C++</span><span class="tag">C#</span><span class="tag">SQL</span><span class="tag">Archi</span>
      <span class="tag or">🎤 Mode entretien</span>
    </div>
  </div>
</div>
</body></html>
